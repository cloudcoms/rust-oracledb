# cloudcoms fork only: proves the break/connect-timeout patches against real
# databases. Hosted runner + throwaway Oracle containers; nothing persists.
name: Break handle live test

on:
  push:
    branches: ['dbwork/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: break-live-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RSO_TEST_MAIN_USER: rsotest
  RSO_TEST_ADMIN_USER: system

jobs:
  live:
    name: Live Oracle tests (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db:
          # images pinned by digest
          - name: 23.26 Free
            image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
            service: FREEPDB1
            upstream_suite: true
          - name: 21c XE
            image: gvenzl/oracle-xe:21.3.0-slim-faststart@sha256:f82bccdf6020d27373fdf0e93046b63eb3f777a0289e329d9839feebaf4555de
            service: XEPDB1
            upstream_suite: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start a throwaway database
        env:
          ORACLE_IMAGE: ${{ matrix.db.image }}
          ORACLE_SERVICE: ${{ matrix.db.service }}
        run: |
          set -euo pipefail
          # random per run; the container is destroyed at the end of the job
          pw="R$(openssl rand -hex 12)"
          echo "::add-mask::$pw"
          {
            echo "RSO_TEST_ADMIN_PASSWORD=$pw"
            echo "RSO_TEST_MAIN_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
          # No published port: docker-proxy would drop TCP urgent data, so the
          # tests connect to the container address (out-of-band breaks).
          docker run -d --name oracle -e ORACLE_PASSWORD="$pw" "$ORACLE_IMAGE"
          ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' oracle)
          echo "RSO_TEST_CONNECT_STRING=${ip}:1521/${ORACLE_SERVICE}" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Format, lint, unit tests (no database)
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib

      - name: Wait for the database
        run: |
          set -euo pipefail
          # the images have no HEALTHCHECK; the entrypoint prints this when open
          for i in $(seq 1 120); do
            if docker logs oracle 2>&1 | grep -q 'DATABASE IS READY TO USE'; then
              echo "ready after ~$((i * 5))s"; exit 0
            fi
            sleep 5
          done
          docker logs --tail 50 oracle
          exit 1

      # Same grants as src/bin/create_test_schema.rs minus CTXAPP: the slim
      # images have no Oracle Text and no upstream test uses it. Credentials
      # go through stdin, never the command line.
      - name: Create the test schema
        env:
          ORACLE_SERVICE: ${{ matrix.db.service }}
        run: |
          set -euo pipefail
          docker exec -i oracle sqlplus -s /nolog <<SQL
          whenever sqlerror exit failure
          connect ${RSO_TEST_ADMIN_USER}/"${RSO_TEST_ADMIN_PASSWORD}"@${ORACLE_SERVICE}
          create user ${RSO_TEST_MAIN_USER} identified by "${RSO_TEST_MAIN_PASSWORD}";
          grant create session, create table, create procedure, create type,
            create view, select any dictionary, change notification,
            unlimited tablespace to ${RSO_TEST_MAIN_USER};
          exit
          SQL

      # Evidence of which break path ran: urgent segments sent to the
      # database mean out-of-band breaks were negotiated, none mean in-band.
      - name: Capture urgent TCP segments
        run: |
          sudo nohup tcpdump -i docker0 -nn -U -w /tmp/urg.pcap \
            'tcp dst port 1521 and tcp[tcpflags] & tcp-urg != 0' \
            > /tmp/tcpdump.log 2>&1 &
          sleep 2

      - name: Break handle tests (live)
        timeout-minutes: 10
        run: cargo test --test test_3600_break -- --nocapture --test-threads=1

      - name: Urgent TCP segments sent to the database
        if: always()
        run: |
          sudo pkill -INT tcpdump || true
          sleep 1
          echo "urgent segments: $(sudo tcpdump -nn -r /tmp/urg.pcap 2>/dev/null | wc -l)"

      - name: Upstream suite (regression, live)
        if: matrix.db.upstream_suite
        timeout-minutes: 20
        run: cargo test --tests -- --test-threads=1

      - name: Remove the database
        if: always()
        run: docker rm -f oracle >/dev/null 2>&1 || true
